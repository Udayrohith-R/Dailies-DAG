[project]
name = "dailies-dag"
version = "0.1.0"
description = "Zero-latency overfit video editing engine: block-paged DAG + CoW + Triton steering + GRPO guardrails"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "einops>=0.8", "numpy>=1.24"]

[project.optional-dependencies]
triton = ["triton>=2.2"]
test = ["pytest>=8.0"]
orchestration = ["trio>=0.25"]
training = ["accelerate>=0.30", "peft>=0.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
